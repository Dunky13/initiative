# Trivy's secret scanner settings, read from the working directory by both
# scans in .github/workflows/security.yml.
#
# Like .trivyignore, every entry carries a justification a reviewer can check.

allow-rules:
  # The Anthropic SDK documents an `execution_identity` field of its beta agents
  # API with the example value `{"type": "service_account"}`. That text is what
  # the Google service-account rule keys on, so the docstrings (and their
  # compiled .pyc) read as a key. They hold no credential. Scoped to those
  # files' directories rather than to the text, which a real key file also
  # contains.
  - id: anthropic-sdk-beta-docs
    description: Example value in the Anthropic SDK's beta API documentation
    path: anthropic/(resources|types)/beta/
